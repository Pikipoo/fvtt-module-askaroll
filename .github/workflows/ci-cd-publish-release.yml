name: CI/CD - Publish release
run-name: CI/CD - [${{ github.event.release.name }}] Publish release by ${{ github.actor }}

on:
  release:
    types: [published]

concurrency:
  group: "${{ github.workflow }}-${{ github.event.release.name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract tag version number
        id: get_version
        uses: battila7/get-version-action@v2

      - name: Run Vite build
        env:
          MODULE_VERSION: ${{steps.get_version.outputs.version-without-v}}
          GH_PROJECT: ${{github.repository}}
          GH_TAG: ${{github.event.release.tag_name}}
        run: bun run build

      - name: Create zip archive
        working-directory: dist
        run: zip -r ./module.zip module.json style.css scripts/ templates/ languages/

      - name: Update release with files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true # Set this to false if you want to prevent updating existing releases
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.draft }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./dist/module.json, ./dist/module.zip"
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
